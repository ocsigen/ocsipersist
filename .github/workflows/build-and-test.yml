name: Build and test

on:
  push:
    branches:
      - master
  pull_request:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: ${{ matrix.os }} / OCaml ${{ matrix.ocaml-compiler }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ocaml-compiler:
          - "4.14"
          - "5"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v7

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      # Ocsipersist targets the Ocsigen Server 8 API (wrapped module names).
      # 8.0.0 is released on GitHub but not yet published on opam
      # (ocaml/opam-repository#30806): pin the release tag until then.
      - run: opam pin -yn git+https://github.com/ocsigen/ocsigenserver#8.0.0

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build @check

      # The PostgreSQL backend test spins up an ephemeral local cluster using
      # the binaries reported by "pg_config --bindir". PostgreSQL is
      # preinstalled on GitHub-hosted Ubuntu runners and pg_config is already
      # on the PATH, so no extra installation step is required. The test is
      # opt-in (see test/dune).
      - name: Run tests
        run: opam exec -- dune runtest
        env:
          OCSIPERSIST_TEST_PGSQL: true
